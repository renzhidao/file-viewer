name: Deploy demo to GitHub Pages

# 把 viewer-demo（文件预览演示站）构建后发布到 GitHub Pages
# 访问地址：https://renzhidao.github.io/file-viewer/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build viewer-demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Set up pinned Binaryen WASM optimizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/file-viewer-binaryen"
          archive="$tool_dir/binaryen-version_132-node.tar.gz"
          mkdir -p "$tool_dir"
          gh release download version_132 --repo WebAssembly/binaryen --pattern binaryen-version_132-node.tar.gz --dir "$tool_dir"
          printf '%s  %s\n' 'f2f49e583f5eafbe2af5da8470177d4d10aedf149752f5dd97736f54eba6f6a2' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec node '$tool_dir/binaryen-version_132/wasm-opt.js' \"\$@\"" > "$tool_dir/wasm-opt"
          chmod +x "$tool_dir/wasm-opt"
          "$tool_dir/wasm-opt" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Build all packages and demo
        run: pnpm build

      - name: Show demo output size
        run: |
          du -sh apps/viewer-demo/dist/
          ls apps/viewer-demo/dist/ | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer-demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
